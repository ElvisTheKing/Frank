name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Create tagged release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: Frank ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  build:
    name: Build (${{ matrix.os }})
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: dist/frank-windows-*.zip
          - os: macos-latest
            package: dist/frank-macos-*.zip
          - os: ubuntu-24.04
            package: dist/frank-linux-*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libssl-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release executable
        run: cargo build --release --locked -p imagecompare-desktop

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/frank-windows-${{ runner.arch }} | Out-Null
          Copy-Item target/release/frank.exe dist/frank-windows-${{ runner.arch }}/
          Copy-Item LICENSE,README.md,CHANGELOG.md,COPYRIGHT dist/frank-windows-${{ runner.arch }}/
          Compress-Archive -Path dist/frank-windows-${{ runner.arch }} -DestinationPath dist/frank-windows-${{ runner.arch }}.zip

      - name: Package Linux build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          package="frank-linux-${{ runner.arch }}"
          mkdir -p "dist/$package"
          install -m 755 target/release/frank "dist/$package/frank"
          cp LICENSE README.md CHANGELOG.md COPYRIGHT "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/Frank.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m 755 target/release/frank "$app/Contents/MacOS/frank"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp LICENSE README.md CHANGELOG.md COPYRIGHT "$app/Contents/Resources/"
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/frank-macos-${{ runner.arch }}.zip"

      - name: Publish platform package
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.package }}
          fail_on_unmatched_files: true
