name: imagecomparetool

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /workspace/target
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - linux-target:/workspace/target

  windows-msvc:
    build:
      context: .
      dockerfile: docker/Dockerfile.windows-msvc
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /workspace/target
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - windows-target:/workspace/target
      - xwin-cache:/root/.cache/cargo-xwin

  ui-test:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui-test
    init: true
    working_dir: /workspace
    environment:
      CARGO_TARGET_DIR: /workspace/target-ui
      EGUI_INSPECTION: 0.0.0.0:5719
      FRANK_TEST_MODE: "1"
      FRANK_TEST_THEME: ${FRANK_TEST_THEME:-dark}
      XDG_CACHE_HOME: /tmp/frank-cache
      XDG_CONFIG_HOME: /tmp/frank-config
    ports:
      - "127.0.0.1:5719:5719"
    volumes:
      - .:/workspace
      - ./artifacts/ui-tests:/artifacts
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - ui-target:/workspace/target-ui
    shm_size: 512m
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/5719'"]
      interval: 2s
      timeout: 2s
      retries: 60
      start_period: 10s

volumes:
  cargo-registry:
  cargo-git:
  linux-target:
  windows-target:
  xwin-cache:
  ui-target:
